name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to release (e.g. v0.1.0); created at the current commit if missing
        required: true

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: macos-latest
    strategy:
      matrix:
        target: [aarch64-apple-darwin, x86_64-apple-darwin]
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup target add ${{ matrix.target }}
          rustup component add clippy

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Lint and test
        if: matrix.target == 'aarch64-apple-darwin'
        run: |
          cargo clippy --all-targets -- -D warnings
          cargo test

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package
        run: |
          dir=dist
          mkdir -p "$dir"
          name="wtp-${{ matrix.target }}"
          cp "target/${{ matrix.target }}/release/wtp" "$dir/wtp"
          tar -czf "$dir/$name.tar.gz" -C "$dir" wtp
          (cd "$dir" && shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256")
          rm "$dir/wtp"

      - uses: actions/upload-artifact@v7
        with:
          name: wtp-${{ matrix.target }}
          path: dist/*

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* install.sh --clobber
          else
            gh release create "$TAG" dist/* install.sh --title "$TAG" --generate-notes --target "$GITHUB_SHA"
          fi
